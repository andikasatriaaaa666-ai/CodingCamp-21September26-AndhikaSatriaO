<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h2>Expense & Budget Visualizer</h2>
        <button class="theme-toggle" id="themeToggleBtn" title="Toggle Theme">
          🌙
        </button>
      </header>

      <!-- Balance Card -->
      <div class="card balance-card">
        <div class="balance-label">Total Balance</div>
        <div class="balance-amount" id="totalBalance">$0.00</div>
      </div>

      <!-- Add Transaction Form -->
      <div class="card">
        <h3 class="form-title">Add Transaction</h3>
        <form id="transactionForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="itemName">Item Name</label>
              <input
                type="text"
                id="itemName"
                placeholder="e.g. Coffee"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label for="amount">Amount ($)</label>
              <input
                type="number"
                id="amount"
                placeholder="e.g. 5.50"
                step="0.01"
                min="0.01"
              />
            </div>
          </div>

          <div class="form-group" style="margin-top: 16px">
            <label for="category">Category</label>
            <div class="category-wrapper">
              <select id="category">
                <!-- Options injected via JS -->
              </select>
              <button
                type="button"
                id="addCategoryBtn"
                class="btn-add-cat"
                title="Add Custom Category"
              >
                +
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">Add Transaction</button>
        </form>
      </div>

      <!-- Dashboard Grid (List & Chart) -->
      <div class="dashboard-grid">
        <!-- Transaction List -->
        <div class="card">
          <div class="list-header">
            <h3 class="section-title" style="margin: 0">Transactions</h3>
            <select id="sortSelect" class="sort-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="highest">Highest Amount</option>
              <option value="lowest">Lowest Amount</option>
              <option value="category">Category</option>
            </select>
          </div>

          <ul class="transaction-list" id="transactionList">
            <!-- List items injected via JS -->
          </ul>
          <div class="empty-state" id="emptyState">No transactions yet.</div>
        </div>

        <!-- Chart -->
        <div class="card">
          <h3 class="section-title">Spending by Category</h3>
          <div class="chart-container">
            <canvas id="expenseChart"></canvas>
          </div>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
